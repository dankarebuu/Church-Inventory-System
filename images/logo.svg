<?xml version="1.0" encoding="utf-8"?>
<!-- Generated simplified vector of provided artwork for crisp website logo -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">WINGMACC — Band Inventory logo</title>
  <desc id="logoDesc">Black circular badge with a cyan cross and light geometric lines</desc>
  <defs>
    <linearGradient id="gradA" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#67d7ff" />
      <stop offset="100%" stop-color="#2fb0e1" />
    </linearGradient>
  </defs>

  <!-- Outer circle (badge) -->
  <circle cx="512" cy="512" r="460" fill="#0f0f10" />

  <!-- Subtle diamond outline behind the circle -->
  <g transform="translate(512,512) rotate(18)">
    <rect x="-520" y="-520" width="1040" height="1040" rx="20" fill="none" stroke="#9fd9f7" stroke-opacity="0.06" stroke-width="6" />
  </g>

  <!-- Geometric network lines (light) -->
  <g stroke="#79e6ff" stroke-opacity="0.22" stroke-width="6" fill="none">
    <path d="M220 720 L340 580 L460 660 L620 480 L780 600" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M300 420 L420 320 L560 380 L680 260" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="340" cy="580" r="6" fill="#79e6ff" stroke="none" />
    <circle cx="460" cy="660" r="6" fill="#79e6ff" stroke="none" />
  </g>

  <!-- Central cross (the main mark) -->
  <g transform="translate(512,480)">
    <rect x="-20" y="-280" width="40" height="560" rx="18" fill="url(#gradA)" transform="translate(0,60)" />
    <rect x="-260" y="-20" width="520" height="40" rx="18" fill="url(#gradA)" />
  </g>

</svg>
